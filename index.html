<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Objects Activity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="display-table"></div>
    <button id="new-book-btn">New Book</button>
    <dialog id="new-book-form">
        <form action="" method="post" id="new-form">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" required>

            <label for="author">Author</label>
            <input type="text" name="author" id="author" required>

            <label for="pages">Pages</label>
            <input type="number" name="pages" id="pages" required>

            <p>Have you read it?</p>

            <label for="yes">Yes</label>
            <input type="radio" name="read" id="yes" value="yes" checked>

            <label for="no">No</label>
            <input type="radio" name="read" id="no" value="no">

            <button type="button" id="form-cancel">Cancel</button>
            <button type="submit" id="form-submit">Add New Book</button>

        </form>
    </dialog>
</body>

<script src="javascript.js"></script>
</html>
